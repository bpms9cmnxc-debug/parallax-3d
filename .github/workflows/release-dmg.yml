name: Parallax-3D.dmg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          for p in \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$p/Contents/Developer" ]; then
              PICK="$p"
              break
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK"
          fi
          xcodebuild -version
          swift --version

      - name: Tests
        run: swift test

      - name: Build DMG
        run: bash packaging/make-dmg.sh "$PWD/Parallax-3D.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parallax-3D.dmg
          path: Parallax-3D.dmg
          if-no-files-found: error

      - name: Publish Parallax-3D.dmg
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(python3 -c "import re,pathlib; t=pathlib.Path('macos/Info.plist').read_text(); m=re.search(r'CFBundleShortVersionString</key>\s*<string>([^<]+)', t); print(m.group(1) if m else '1.6.0')")
          TAG="v$VER"
          TITLE="Parallax 3D $VER"
          test -f Parallax-3D.dmg
          zip -r ParallaxTrack-iOS.zip ios -x "*.DS_Store"
          NOTES="$(cat <<'EOF'
          ## Download

          1. **Parallax-3D.dmg** — Mac-App (Apple Silicon)
          2. **ParallaxTrack-iOS.zip** — iPhone LiDAR/TrueDepth (Xcode → iPhone)

          Nicht anfassen: *Source code (zip)* / *Source code (tar.gz)*.

          ### Mac
          1. DMG öffnen, App nach Programme
          2. Rechtsklick → Öffnen
          3. Kamera erlauben
          4. Oben rechts **iPhone LiDAR** — dort stehen IP und Anleitung
          5. Modell **Diorama**: Flasche vorn, Tasse in der Scheibe, Bücher hinten

          ### iPhone
          1. ParallaxTrack-iOS.zip entpacken, `ParallaxTrack.xcodeproj` in Xcode
          2. Signing: Personal Team, aufs Gerät
          3. LiDAR-Rückseite (Pro, wie Webcam oben auf den Mac) oder TrueDepth-Front
          4. Lokalnetz erlauben, Senden an den Mac
          5. Auf dem Mac **Mitte setzen**

          Apple Silicon, macOS 14–27. **Kein Hand-Tracking. Kein HTML.**
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest || true
          else
            gh release create "$TAG" --title "$TITLE" --latest --notes "$NOTES"
          fi
          gh release upload "$TAG" Parallax-3D.dmg ParallaxTrack-iOS.zip --clobber
          gh release view "$TAG"
